<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KamenRider Decade</title>
    <link rel="stylesheet" href="style.css">
    <!-- J2ME Engine (No Audio Overhead) -->
    <script src="js/zip/zip.js"></script>
    <script src="js/zip/inflate.js"></script>
    <script src="js/zip/zip-ext.js"></script>
    <script src="js/js2me.js"></script>
    <script src="js/bufferStream.js"></script>
    <script src="js/convert.js"></script>
    <script src="js/classes.js"></script>
    <script src="js/program_zazu.js"></script>
    <script src="js/execute.js"></script>
    <script src="js/events.js"></script>
    <script src="js/manifest.js"></script>
    <script src="js/methodStub.js"></script>
    <script src="js/launcher.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/numbers.js"></script>
    <script src="js/resources.js"></script>
    <script src="js/threads.js"></script>
    <script src="js/utils.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- 1. Android Decade Style Toolbar -->
        <header id="toolbar">
            <div class="toolbar-title">
                <span>KamenRider</span>
                <span class="decade-badge">DECADE</span>
            </div>
            <div class="toolbar-actions">
                <button id="btn-add-one" class="tool-btn" title="Thêm 1 Tab">+</button>
                <button id="btn-add-many" class="tool-btn" title="Thêm nhiều Tab">++</button>
                <button id="btn-menu" class="tool-btn" title="Cài đặt Decade">&#9776;</button>
            </div>
        </header>

        <!-- 2. Decade Tab Bar -->
        <nav id="tab-bar">
            <div id="tabs-scroll">
                <div class="tab-item active" data-slot="1">
                    <span class="tab-title">Tab 1</span>
                    <button class="tab-close" data-slot="1">&times;</button>
                </div>
            </div>
        </nav>

        <!-- 3. Game Screen Area -->
        <main id="game-container">
            <div id="screen-wrapper">
                <div id="screen"></div>
                <div id="game-overlay-status">
                    <span id="slot-indicator">SLOT 1</span>
                    <span id="net-indicator" style="color: #68d391;">NET: DIRECT</span>
                    <span id="fps-counter">60 FPS</span>
                </div>
            </div>
        </main>

        <!-- 4. Retro Keypad -->
        <footer id="keypad">
            <div class="keypad-row soft-keys">
                <button class="key-btn" data-key="SOFT_LEFT" id="choice">LSK</button>
                <button class="key-btn" data-key="UP">&#9650;</button>
                <button class="key-btn" data-key="SOFT_RIGHT" id="back">RSK</button>
            </div>
            <div class="keypad-row dpad-middle">
                <button class="key-btn" data-key="LEFT">&#9664;</button>
                <button class="key-btn dpad-center" data-key="FIRE">OK</button>
                <button class="key-btn" data-key="RIGHT">&#9654;</button>
            </div>
            <div class="keypad-row">
                <button class="key-btn" data-key="CALL">&#128222;</button>
                <button class="key-btn" data-key="DOWN">&#9660;</button>
                <button class="key-btn" data-key="END">&#128225;</button>
            </div>
            <div class="keypad-grid numpad">
                <button class="key-btn num" data-key="1">1</button>
                <button class="key-btn num" data-key="2">2</button>
                <button class="key-btn num" data-key="3">3</button>
                <button class="key-btn num" data-key="4">4</button>
                <button class="key-btn num" data-key="5">5</button>
                <button class="key-btn num" data-key="6">6</button>
                <button class="key-btn num" data-key="7">7</button>
                <button class="key-btn num" data-key="8">8</button>
                <button class="key-btn num" data-key="9">9</button>
                <button class="key-btn num" data-key="STAR">*</button>
                <button class="key-btn num" data-key="0">0</button>
                <button class="key-btn num" data-key="HASH">#</button>
            </div>
        </footer>

        <!-- 5. Settings / Decade Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>KamenRider Decade - Tuỳ Chọn</h2>
                    <button id="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <!-- Nạp Game -->
                    <div class="settings-group">
                        <h3>Nạp Game Java (.JAR)</h3>
                        <p style="font-size: 11px; color: #94a3b8; margin-bottom: 6px;">Chọn file .jar từ ứng dụng Tệp của iPhone.</p>
                        <input type="file" id="jar-file-input" accept=".jar,application/java-archive,*/*">
                        <button id="btn-load-demo" class="btn-action" style="background: #253043; border: 1px solid #3d4d68;">Chạy Thử Demo</button>
                    </div>

                    <!-- Đổi IP NSO -->
                    <div class="settings-group">
                        <h3>Thay IP Phiên Bản (NSO Server)</h3>
                        <select id="server-select">
                            <option value="custom">Tự nhập IP/Port...</option>
                            <option value="112.213.94.135:14444">Server 1 (Bokken)</option>
                            <option value="112.213.94.136:14444">Server 2 (Shuriken)</option>
                            <option value="112.213.94.137:14444">Server 3 (Tessen)</option>
                            <option value="112.213.94.138:14444">Server 4 (Kunai)</option>
                            <option value="112.213.94.139:14444">Server 5 (Katana)</option>
                        </select>
                        <div class="ip-row">
                            <input type="text" id="custom-ip" placeholder="IP: 112.213.94.135">
                            <input type="number" id="custom-port" placeholder="Port: 14444">
                        </div>
                        <button id="btn-save-ip" class="btn-action">Lưu IP cho Tab này</button>
                    </div>

                    <!-- Quản Lý Proxy -->
                    <div class="settings-group">
                        <h3>Quản Lý Proxy Theo Slot</h3>
                        <select id="proxy-type">
                            <option value="DIRECT">Không dùng proxy (Direct)</option>
                            <option value="SOCKS5">SOCKS5 Proxy</option>
                            <option value="HTTP">HTTP CONNECT Proxy</option>
                        </select>
                        <div class="ip-row">
                            <input type="text" id="proxy-host" placeholder="Host: 103.x.x.x">
                            <input type="number" id="proxy-port" placeholder="Port: 1080">
                        </div>
                        <button id="btn-save-proxy" class="btn-action">Lưu Proxy cho Tab này</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Many Tabs Dialog -->
        <div id="add-many-modal" class="modal hidden">
            <div class="modal-content" style="max-width: 300px;">
                <div class="modal-header">
                    <h2>Mở Hàng Loạt Tab</h2>
                    <button id="add-many-close">&times;</button>
                </div>
                <div class="modal-body">
                    <label style="font-size: 13px;">Nhập số lượng tab muốn thêm:</label>
                    <input type="number" id="add-many-count" value="3" min="1" max="20" style="padding: 8px; font-size: 15px; text-align: center; font-weight: bold; width: 100%; margin: 8px 0;">
                    <button id="btn-confirm-add-many" class="btn-action">Tạo Tab</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Controller -->
    <script src="app.js"></script>
</body>
</html>
