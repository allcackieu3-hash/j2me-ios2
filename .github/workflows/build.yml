name: Build J2ME Decade iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application with Xcode
        run: |
          xcodebuild -project J2MEDecade.xcodeproj \
            -scheme J2MEDecade \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "J2MEDecade.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "J2MEDecade.app" -type d | head -n 1)
          fi
          echo "Found App at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          # Copy Web files to both root and Web/ subdirectory
          mkdir -p Payload/J2MEDecade.app/Web
          cp -R J2MEDecade/Web/* Payload/J2MEDecade.app/Web/
          cp -R J2MEDecade/Web/* Payload/J2MEDecade.app/
          echo "=== Content of App Bundle ==="
          ls -la Payload/J2MEDecade.app/
          zip -r J2ME-Decade.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: J2ME-Decade-IPA
          path: J2ME-Decade.ipa
          retention-days: 14

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0-decade
          name: "J2ME Decade iOS v1.0"
          body: |
            ## J2ME Decade iOS - KamenRider Decade Multi-Tab Edition
            - **Đã loại bỏ hoàn toàn hệ thống âm thanh** (tiết kiệm CPU, không gây lag giật âm thanh).
            - **Tích hợp nhân máy ảo Java J2ME** (chạy game .jar trực tiếp trên iPhone).
            - **Cầu nối mạng Socket TCP Native** qua Swift Network.framework.
            - **Đa Tab (Multi-Tab)**, đổi IP Server NSO (Bokken, Shuriken, Tessen, Kunai, Katana) & Proxy SOCKS5/HTTP per slot.
            - **Cài đặt**: Kéo file `J2ME-Decade.ipa` vào Sideloadly hoặc 3uTools để cài lên iPhone.
          files: J2ME-Decade.ipa
